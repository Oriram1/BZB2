# Auth calls this hook server-side, with a Standard Webhooks signature instead
# of a user JWT — so JWT verification has to be off or every send would 401.
[functions.send-auth-email]
verify_jwt = false

# Invoked by pg_net from a database trigger, authenticated by a shared secret
# header rather than a user JWT.
[functions.notify-dispatch]
verify_jwt = false

# Invoked by pg_cron on the hour, same shared-secret authentication.
[functions.send-parent-digest]
verify_jwt = false

# Operator-only diagnostic, run by hand with a shared secret header.
[functions.email-selftest]
verify_jwt = false

# All other functions use Supabase JWT verification at the gateway. Keep this
# explicit so a future config change cannot silently make user endpoints
# public. The three exceptions above are machine-to-machine integrations and
# must authenticate with their own webhook/shared-secret checks.
[functions.admin-manage-users]
verify_jwt = true
[functions.admin-reset-password]
verify_jwt = true
[functions.create-family-link-code]
verify_jwt = true
[functions.geocode-address]
verify_jwt = true
[functions.push-subscribe]
verify_jwt = true
[functions.redeem-family-link-code]
verify_jwt = true
