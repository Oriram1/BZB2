<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>keyboard probe</title>
    <style>
      /* Mirrors src/index.css + Chat.tsx so the probe fails the same way the app does. */
      :root {
        --app-height: 100dvh;
        --app-offset: 0px;
        --bottom-nav-height: calc(4rem + env(safe-area-inset-bottom));
      }
      html[data-keyboard="open"] { --bottom-nav-height: 0px; }
      html[data-keyboard="open"] .app-bottom-nav { display: none; }
      * { box-sizing: border-box; margin: 0; }
      body { font-family: -apple-system, sans-serif; background: #eee; }

      /* MODE=before -> exactly today's markup. MODE=after -> the candidate fix. */
      .screen {
        display: flex; flex-direction: column; overflow: hidden;
        height: var(--app-height); padding-bottom: var(--bottom-nav-height); background: #fff;
      }
      html[data-mode="after"] .screen {
        position: fixed; inset: 0 0 auto 0; top: var(--app-offset);
      }
      .head { flex: none; background: #f97316; color: #fff; padding: 12px; font-weight: 700; }
      .list { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 12px; background: #fffdf7; }
      .composer { flex: none; border-top: 2px solid #f97316; background: #fff; padding: 8px; }
      textarea { width: 100%; font-size: 16px; padding: 10px; border: 1px solid #ccc; border-radius: 12px; resize: none; }
      .app-bottom-nav {
        position: fixed; bottom: 0; left: 0; right: 0; height: 4rem;
        padding-bottom: env(safe-area-inset-bottom);
        background: #fffdf7; border-top: 1px solid #ddd; display: flex; align-items: center; justify-content: space-around;
      }
      #dbg, #dbg2 {
        position: fixed; left: 0; right: 0; z-index: 9; background: #000; color: #0f0;
        font: 700 11px/1.3 ui-monospace, monospace; padding: 4px; direction: ltr; white-space: pre;
      }
      #dbg { top: 0; }
      /* A second copy pinned to the bottom: when the page scrolls itself away, the
         top one goes with it and there is nothing left to read. */
      /* Narrow, so it cannot hide the composer it is reporting on. */
      #dbg2 { bottom: 0; right: auto; width: 58%; opacity: 0.9; }
      #verdict { font-size: 15px; }
    </style>
  </head>
  <body>
    <div id="dbg"></div>
    <div id="dbg2"></div>
    <div class="screen">
      <div class="head" style="padding-top:52px">הודעות</div>
      <div class="list" id="list"></div>
      <div class="composer">
        <textarea id="ta" rows="1" placeholder="הקלד הודעה..."></textarea>
      </div>
    </div>
    <nav class="app-bottom-nav"><span>בית</span><span>מטלות</span><span>שלי</span><span>צ'אט</span><span>עוד</span></nav>

    <script>
      const params = new URLSearchParams(location.search);
      document.documentElement.dataset.mode = params.get("mode") === "after" ? "after" : "before";
      // Tapping either readout flips before/after, so the mode can be switched
      // without retyping a URL on a phone.
      const flip = () => {
        location.search = "?mode=" + (document.documentElement.dataset.mode === "after" ? "before" : "after");
      };
      addEventListener("DOMContentLoaded", () => {
        document.getElementById("dbg").addEventListener("click", flip);
        document.getElementById("dbg2").addEventListener("click", flip);
      });
      const list = document.getElementById("list");
      for (let i = 1; i <= 25; i++) {
        const p = document.createElement("p");
        p.textContent = "הודעה מספר " + i;
        p.style.padding = "8px";
        list.appendChild(p);
      }
      list.scrollTop = list.scrollHeight;

      const root = document.documentElement;
      const vv = window.visualViewport;
      const KEYBOARD_THRESHOLD_PX = 200;

      function syncBefore() {
        const height = vv?.height ?? window.innerHeight;
        root.style.setProperty("--app-height", Math.round(height) + "px");
        const keyboardOpen = window.innerHeight - height > KEYBOARD_THRESHOLD_PX;
        root.dataset.keyboard = keyboardOpen ? "open" : "closed";
      }

      /* Candidate fix: measure against the tallest viewport ever seen (works when
         the keyboard resizes the layout viewport, as it does in a standalone PWA)
         and follow the visual viewport's offset so iOS's auto-scroll cannot push
         the composer under the keyboard. */
      let maxSeen = 0;
      function syncAfter() {
        const height = vv?.height ?? window.innerHeight;
        maxSeen = Math.max(maxSeen, height, window.innerHeight);
        root.style.setProperty("--app-height", Math.round(height) + "px");
        root.style.setProperty("--app-offset", Math.round(vv?.offsetTop ?? 0) + "px");
        root.dataset.keyboard = maxSeen - height > KEYBOARD_THRESHOLD_PX ? "open" : "closed";
      }
      const sync = () => (root.dataset.mode === "after" ? syncAfter() : syncBefore());

      sync();
      vv?.addEventListener("resize", sync);
      vv?.addEventListener("scroll", sync);
      addEventListener("resize", sync);
      addEventListener("orientationchange", sync);

      const dbg = document.getElementById("dbg");
      const dbg2 = document.getElementById("dbg2");
      let trace = [];
      let tracing = false;
      let hiddenSamples = 0;

      const sample = () => {
        const ta = document.getElementById("ta").getBoundingClientRect();
        // Where the visible viewport actually is, in layout coordinates.
        const top = vv ? vv.offsetTop : 0;
        const bottom = top + (vv ? vv.height : innerHeight);
        return {
          visible: ta.top >= top - 1 && ta.bottom <= bottom + 1,
          kbd: root.dataset.keyboard,
          innerH: innerHeight,
          vvH: Math.round(vv?.height ?? -1),
          vvTop: Math.round(vv?.offsetTop ?? -1),
          scrollY: Math.round(scrollY),
          ta: Math.round(ta.top) + ".." + Math.round(ta.bottom),
          win: Math.round(top) + ".." + Math.round(bottom),
        };
      };

      // The break is transient, so record the two seconds after focus and keep them
      // on screen; by the time a screenshot can be taken the state has converged.
      addEventListener("focusin", () => {
        trace = [];
        hiddenSamples = 0;
        tracing = true;
        setTimeout(() => (tracing = false), 2000);
      });

      setInterval(() => {
        const s = sample();
        if (tracing) {
          if (!s.visible) hiddenSamples++;
          if (trace.length < 14) {
            trace.push(
              (s.visible ? "ok  " : "HID ") + "kbd=" + s.kbd + " vvH=" + s.vvH +
              " vvTop=" + s.vvTop + " scrollY=" + s.scrollY + " ta=" + s.ta + " win=" + s.win,
            );
          }
        }
        const head =
          "mode=" + root.dataset.mode + " kbd=" + s.kbd +
          "\ninnerH=" + s.innerH + " vvH=" + s.vvH + " vvTop=" + s.vvTop + " scrollY=" + s.scrollY +
          "\ninput " + s.ta + "  visible " + s.win +
          "\nCOMPOSER " + (s.visible ? "OK VISIBLE" : "HIDDEN <<<<") +
          "\nhidden samples after focus: " + hiddenSamples;
        dbg.textContent = head + "\n--- trace ---\n" + trace.join("\n");
        dbg.style.color = hiddenSamples ? "#f33" : "#0f0";
        dbg2.textContent = head;
        dbg2.style.color = s.visible ? "#0f0" : "#f33";
      }, 120);
    </script>
  </body>
</html>
